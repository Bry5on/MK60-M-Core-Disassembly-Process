; Gauge.S MK60 Tool bridge — dumb USB<->CAN/K-line translator.
; Two envs select the HW version at BUILD time (no runtime detection):
;   gaugesV4 = classic ESP32 bench board (PC link = FTDI on UART0)
;   gaugesV5 = ESP32-S3 in-car board     (PC link = native USB-CDC)
; Pin maps come from src/config.h via -DPCB_VER.

[env:gaugesV4]
platform = espressif32
platform_packages = framework-arduinoespressif32 @ https://github.com/espressif/arduino-esp32.git#44da992b774f76777bb2e931dd76cfcf12b9fe70
framework = arduino
board = gaugesV4
monitor_speed = 921600
build_flags =
	-DCORE_DEBUG_LEVEL=0
	-DPCB_VER=40
	; Keep the build machine out of the image: remap absolute source paths (the ESP32 core bakes a
	; $HOME/.platformio/.../__FILE__ into an assert) so the username doesn't ship in the firmware.bin
	; that the GUI embeds. $HOME is resolved at build time, so nothing machine-specific is committed.
	-ffile-prefix-map=${sysenv.HOME}=.

[env:gaugesV5]
platform = espressif32
platform_packages = framework-arduinoespressif32 @ https://github.com/espressif/arduino-esp32.git#44da992b774f76777bb2e931dd76cfcf12b9fe70
framework = arduino
board = gaugesV5
monitor_speed = 921600
; Flashing the S3 over an external FTDI on UART0 (manual download mode), not the
; native USB port: suppress the native-USB reset dance and keep the write slow so
; a bare FTDI + jumpers doesn't corrupt the stream. Does not affect runtime.
upload_speed = 115200
board_upload.use_1200bps_touch = no
board_upload.wait_for_upload_port = no
board_upload.require_upload_port = yes
build_flags =
	-DCORE_DEBUG_LEVEL=0
	-DPCB_VER=50
	-DARDUINO_USB_CDC_ON_BOOT=1
	; Remap absolute source paths so the build machine's $HOME (incl. the username) doesn't ship in the
	; firmware.bin the GUI embeds. $HOME resolved at build time; nothing machine-specific is committed.
	-ffile-prefix-map=${sysenv.HOME}=.
